# fly.toml app configuration file for connect4-bwc
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'connect4-bwc'
primary_region = 'sjc'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
