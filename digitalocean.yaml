alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DEPLOYMENT_LIVE
  - rule: DOMAIN_FAILED
ingress:
  rules:
    - component:
        name: connect4-bwc
      match:
        path:
          prefix: /
name: connect4-bwc
region: sfo
services:
  - dockerfile_path: Dockerfile
    github:
      branch: main
      deploy_on_push: true
      repo: lumotic-ca/connect4-BWC
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    name: connect4-bwc
    run_command: node server/index.js
    source_dir: /
